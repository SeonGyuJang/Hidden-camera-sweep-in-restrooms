# fly.toml — generated for fly.io deployment
# Run: fly launch --no-deploy  (to link), then fly deploy

app = "ku-sejong-restroom-inspection"
primary_region = "nrt"   # Tokyo — closest to Korea

[build]

[env]
  FLASK_ENV = "production"
  FLASK_APP = "app.py"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
