# fly.toml app configuration file
# https://fly.io/docs/reference/configuration/

app = 'hidden-camera-sweep-in-restrooms'
primary_region = 'nrt'

[build]

[env]
  FLASK_APP = 'app.py'
  FLASK_ENV = 'production'
  DATA_DIR  = '/data'

# Volume mount: SQLite DB + 사진 파일 영구 저장
[[mounts]]
  source      = "inspection_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
