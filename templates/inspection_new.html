{% extends "base.html" %}
{% block title %}점검 기록 등록{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="card shadow-sm">
      <div class="card-header bg-crimson text-white d-flex align-items-center">
        <i class="fa-solid fa-clipboard-check me-2"></i>
        <strong>불법촬영 점검 기록 등록</strong>
      </div>
      <div class="card-body">
        <form method="post" id="inspectionForm">

          <!-- 기본 정보 -->
          <h6 class="fw-bold text-crimson border-bottom pb-2 mb-3">
            <i class="fa-solid fa-info-circle me-1"></i> 기본 정보
          </h6>
          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label class="form-label fw-bold">건물 선택 <span class="text-danger">*</span></label>
              <select id="buildingSelect" class="form-select" onchange="loadRestrooms(this.value)">
                <option value="">건물 선택</option>
                {% for r in restrooms|map(attribute='building')|unique(attribute='id')|sort(attribute='name') %}
                <option value="{{ r.id }}">{{ r.name }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-bold">화장실 <span class="text-danger">*</span></label>
              <select name="restroom_id" id="restroomSelect" class="form-select" required>
                <option value="">화장실 선택</option>
                {% for r in restrooms %}
                <option value="{{ r.id }}"
                  data-building="{{ r.building_id }}"
                  {% if prefill_restroom == r.id %}selected{% endif %}>
                  {{ r.building.name }} {{ r.floor }} {{ r.gender }}화장실
                  {% if r.location_detail %}({{ r.location_detail }}){% endif %}
                </option>
                {% endfor %}
              </select>
            </div>
          </div>

          <div class="row g-3 mb-4">
            <div class="col-md-4">
              <label class="form-label fw-bold">조 <span class="text-danger">*</span></label>
              <select name="group_number" class="form-select" required>
                <option value="">조 선택</option>
                <option value="1">1조</option>
                <option value="2">2조</option>
                <option value="3">3조</option>
                <option value="4">4조</option>
              </select>
            </div>
            <div class="col-md-8">
              <label class="form-label fw-bold">점검자 이름</label>
              <input type="text" name="inspector_name" class="form-control"
                     placeholder="점검자 성명 입력">
            </div>
          </div>

          <!-- 사진 촬영 -->
          <h6 class="fw-bold text-crimson border-bottom pb-2 mb-3">
            <i class="fa-solid fa-camera me-1"></i> 사진 촬영
          </h6>
          <div class="row g-3 mb-4">
            <div class="col-md-6">
              <label class="form-label fw-bold">점검 전 사진</label>
              <div class="capture-area" id="beforeArea" onclick="triggerCapture('before')">
                <img id="beforePreview" src="" style="display:none">
                <div id="beforePlaceholder">
                  <i class="fa-solid fa-camera capture-icon"></i>
                  <div class="capture-label">클릭하여 촬영 / 업로드</div>
                </div>
              </div>
              <input type="file" id="beforeFile" accept="image/*" capture="environment"
                     class="d-none" onchange="handleFile(event,'before')">
              <input type="hidden" name="before_photo" id="beforeData">
              <div class="mt-2 d-flex gap-2">
                <button type="button" class="btn-camera" onclick="openCamera('before')">
                  <i class="fa-solid fa-camera"></i> 카메라
                </button>
                <button type="button" class="btn btn-sm btn-outline-secondary"
                        onclick="document.getElementById('beforeFile').click()">
                  <i class="fa-solid fa-upload"></i> 파일
                </button>
                <button type="button" class="btn btn-sm btn-outline-danger"
                        onclick="clearPhoto('before')">지우기</button>
              </div>
            </div>

            <div class="col-md-6">
              <label class="form-label fw-bold">점검 후 사진</label>
              <div class="capture-area" id="afterArea" onclick="triggerCapture('after')">
                <img id="afterPreview" src="" style="display:none">
                <div id="afterPlaceholder">
                  <i class="fa-solid fa-camera capture-icon"></i>
                  <div class="capture-label">클릭하여 촬영 / 업로드</div>
                </div>
              </div>
              <input type="file" id="afterFile" accept="image/*" capture="environment"
                     class="d-none" onchange="handleFile(event,'after')">
              <input type="hidden" name="after_photo" id="afterData">
              <div class="mt-2 d-flex gap-2">
                <button type="button" class="btn-camera" onclick="openCamera('after')">
                  <i class="fa-solid fa-camera"></i> 카메라
                </button>
                <button type="button" class="btn btn-sm btn-outline-secondary"
                        onclick="document.getElementById('afterFile').click()">
                  <i class="fa-solid fa-upload"></i> 파일
                </button>
                <button type="button" class="btn btn-sm btn-outline-danger"
                        onclick="clearPhoto('after')">지우기</button>
              </div>
            </div>
          </div>

          <!-- 인라인 카메라 뷰파인더 -->
          <div id="cameraModal" class="d-none mb-3">
            <div class="card border-crimson">
              <div class="card-header bg-dark text-white d-flex align-items-center">
                <span id="cameraLabel">카메라</span>
                <button type="button" class="btn btn-sm btn-light ms-auto" onclick="closeCamera()">닫기</button>
              </div>
              <div class="card-body p-0 text-center bg-black">
                <video id="cameraVideo" autoplay playsinline
                       style="width:100%;max-height:300px;object-fit:contain"></video>
              </div>
              <div class="card-footer text-center">
                <button type="button" class="btn btn-crimson px-4" onclick="capturePhoto()">
                  <i class="fa-solid fa-circle me-1"></i>촬영
                </button>
                <button type="button" class="btn btn-outline-secondary ms-2" onclick="switchCamera()">
                  <i class="fa-solid fa-rotate"></i>
                </button>
              </div>
            </div>
            <canvas id="cameraCanvas" class="d-none"></canvas>
          </div>

          <!-- 조치 및 특이사항 -->
          <h6 class="fw-bold text-crimson border-bottom pb-2 mb-3">
            <i class="fa-solid fa-clipboard-list me-1"></i> 조치 및 특이사항
          </h6>
          <div class="mb-3">
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" name="action_taken"
                     id="actionTaken" value="1" onchange="toggleActionDetail(this)">
              <label class="form-check-label fw-bold" for="actionTaken">
                조치 사항 있음
              </label>
            </div>
          </div>
          <div class="mb-3" id="actionDetailDiv" style="display:none">
            <label class="form-label">조치 내용</label>
            <textarea name="action_detail" class="form-control" rows="2"
                      placeholder="어떤 조치를 취했는지 상세 기술"></textarea>
          </div>
          <div class="mb-3">
            <label class="form-label fw-bold">특이사항</label>
            <textarea name="notes" class="form-control" rows="3"
                      placeholder="점검 중 발견한 특이사항, 불법 촬영 의심 기기 발견 여부 등 자유롭게 기재"></textarea>
          </div>
          <div class="mb-4">
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" name="completed"
                     id="completed" value="1" checked>
              <label class="form-check-label fw-bold" for="completed">
                점검 완료
              </label>
            </div>
          </div>

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-crimson px-5 py-2">
              <i class="fa-solid fa-save me-1"></i>저장
            </button>
            <a href="{{ url_for('inspections') }}" class="btn btn-outline-secondary">취소</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="{{ url_for('static', filename='js/camera.js') }}"></script>
<script>
// Filter restrooms by building
const allRestrooms = [...document.querySelectorAll('#restroomSelect option[data-building]')];

function loadRestrooms(bid) {
  const sel = document.getElementById('restroomSelect');
  allRestrooms.forEach(opt => {
    opt.style.display = (!bid || opt.dataset.building === bid) ? '' : 'none';
  });
  sel.value = '';
}

// Pre-select building if restroom is pre-filled
(function() {
  const sel = document.getElementById('restroomSelect');
  if (sel.value) {
    const opt = sel.options[sel.selectedIndex];
    if (opt) document.getElementById('buildingSelect').value = opt.dataset.building;
  }
})();

function toggleActionDetail(cb) {
  document.getElementById('actionDetailDiv').style.display = cb.checked ? '' : 'none';
}
</script>
{% endblock %}
