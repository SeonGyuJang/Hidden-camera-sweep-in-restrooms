{% extends "base.html" %}
{% block title %}화장실 추가{% endblock %}
{% block header_left %}
<button class="t-back" onclick="history.back()">
  <i class="fa-solid fa-chevron-left" style="font-size:15px"></i> 화장실 추가
</button>
{% endblock %}

{% block content %}
<div style="padding:16px 20px 0">
  <div style="font-size:14px;color:var(--t3)">건물</div>
  <div style="font-size:18px;font-weight:800">{{ b.name }}</div>
</div>

<form method="post">
  <div class="t-section-title">화장실 정보</div>
  <div class="t-form">
    <div class="t-form-group">
      <label class="t-form-label">층</label>
      <input type="text" name="floor" class="t-input" placeholder="예: 1F, 2F, B1" required>
    </div>
    <div class="t-form-group">
      <label class="t-form-label">성별</label>
      <div class="gender-group">
        <div class="gender-opt" id="gopt-남" onclick="selGender('남')">남자</div>
        <div class="gender-opt" id="gopt-여" onclick="selGender('여')">여자</div>
        <div class="gender-opt" id="gopt-공용" onclick="selGender('공용')">공용</div>
      </div>
      <input type="hidden" name="gender" id="genderInput" required>
    </div>
    <div class="t-form-group">
      <label class="t-form-label">위치 메모 (선택)</label>
      <input type="text" name="location_detail" class="t-input"
             placeholder="예: 엘리베이터 옆, 복도 끝">
    </div>
  </div>

  <div class="t-form" style="padding-bottom:16px">
    <button type="submit" class="t-btn t-btn-primary t-btn-full">추가하기</button>
    <a href="{{ url_for('building_page', bid=b.id) }}" class="t-btn t-btn-gray t-btn-full">취소</a>
  </div>
</form>
<script>
function selGender(g) {
  ['남','여','공용'].forEach(v => {
    document.getElementById('gopt-'+v).className = 'gender-opt' + (v===g?' sel-'+v:'');
  });
  document.getElementById('genderInput').value = g;
}
</script>
{% endblock %}
